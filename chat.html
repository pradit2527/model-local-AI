<!doctype html>
<html lang="th" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Absolute AI</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<style>
  :root, [data-theme="dark"] {
    --bg:#070a09; --panel:#0e1311; --panel2:#131a17; --text:#d6e2dc; --muted:#7f9088; --line:#1e2924;
    --accent:#39ff88; --accent-dim:#1f9e57; --accent-soft:rgba(57,255,136,.08); --ink:#03120a; --danger:#ff5266;
    --user:#0f1f18; --user-line:#173326; --code:#050807; --codetext:#c9f5dc; --head:rgba(7,10,9,.88); --bubble:rgba(14,19,17,.92);
    --wm:.05; --wm-text:.045; --scroll:rgba(255,255,255,.16); --scroll-hover:rgba(255,255,255,.3);
  }
  [data-theme="light"] {
    --bg:#f4f6f5; --panel:#ffffff; --panel2:#eef2f0; --text:#16201b; --muted:#5b6a63; --line:#d9e1dd;
    --accent:#0f9d58; --accent-dim:#0f9d58; --accent-soft:rgba(15,157,88,.10); --ink:#ffffff; --danger:#d93044;
    --user:#e3f3ea; --user-line:#c3e3d1; --code:#f6f8f7; --codetext:#16301f; --head:rgba(244,246,245,.9); --bubble:rgba(255,255,255,.95);
    --wm:.06; --wm-text:.06; --scroll:rgba(0,0,0,.16); --scroll-hover:rgba(0,0,0,.3);
  }
  /* Claude-style scrollbars: thin, no arrows, invisible until you hover the scrolling area */
  #log, #chats, .pb pre, .pb .mediaview, .tiles, .skillmenu, .settings, textarea, pre {
    scrollbar-width:thin; scrollbar-color:transparent transparent; transition:scrollbar-color .2s;
  }
  #log:hover, #chats:hover, .pb pre:hover, .pb .mediaview:hover, .tiles:hover, .skillmenu:hover, .settings:hover, textarea:hover, pre:hover {
    scrollbar-color:var(--scroll) transparent;
  }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.6 system-ui, "Segoe UI", "Noto Sans Thai", "Noto Sans SC", sans-serif; display:flex; flex-direction:column; overflow:hidden; }
  button, select, input, textarea { font:inherit; color:inherit; }

  .watermark { position:fixed; inset:0; pointer-events:none; z-index:0;
    background: radial-gradient(ellipse at 50% 45%, var(--accent-soft), transparent 60%),
      url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><g font-family='monospace' font-size='13' fill='%2339a86b' fill-opacity='0.5'><text x='8' y='20'>01101 00110</text><text x='40' y='62'>1001 0111 01</text><text x='4' y='104'>0x41 0x49</text><text x='60' y='146'>110 0101 1</text><text x='18' y='188'>&lt;/&gt; 0110</text></g></svg>"); }
  .watermark::before { content:''; position:absolute; inset:0; background:var(--bg); opacity:calc(1 - var(--wm-text) * 2); }
  .watermark img { position:absolute; left:50%; top:50%; width:min(520px,70vw); transform:translate(-50%,-46%); opacity:var(--wm); }

  header { position:relative; z-index:3; padding:8px 12px; border-bottom:1px solid var(--line); background:var(--head); backdrop-filter:blur(6px); display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .brand { display:flex; align-items:center; gap:8px; margin-right:4px; }
  .brand img { width:32px; height:32px; }
  .brand h1 { font:700 17px/1 system-ui, sans-serif; margin:0; white-space:nowrap; }
  .brand h1 b { color:var(--accent); }
  select, .field { padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:var(--panel); font-size:14px; max-width:220px; }
  .toggle { display:inline-flex; align-items:center; gap:5px; padding:5px 10px; border:1px solid var(--line); border-radius:999px; background:var(--panel); color:var(--muted); font-size:13px; cursor:pointer; user-select:none; white-space:nowrap; }
  .toggle input { display:none; }
  .toggle:has(input:checked) { color:var(--accent); border-color:var(--accent-dim); background:var(--accent-soft); }
  .status { font-size:12px; color:var(--muted); white-space:nowrap; }
  .spacer { flex:1; }
  .icon-btn { display:inline-grid; place-items:center; min-width:34px; height:34px; padding:0 8px; border:1px solid var(--line); border-radius:8px; background:var(--panel); cursor:pointer; font-size:15px; }
  .icon-btn:hover, .secondary:hover { border-color:var(--accent-dim); }
  .only-narrow { display:none; }
  .settings { position:absolute; right:12px; top:100%; margin-top:6px; width:min(380px,calc(100vw - 24px)); padding:14px; border:1px solid var(--line); border-radius:10px; background:var(--panel); box-shadow:0 12px 32px rgba(0,0,0,.35); display:none; flex-direction:column; gap:10px; z-index:20; }
  .settings.open { display:flex; }
  .settings label { font-size:13px; color:var(--muted); display:flex; flex-direction:column; gap:4px; }
  .settings textarea, .settings select { width:100%; max-width:none; padding:8px; border:1px solid var(--line); border-radius:6px; background:var(--panel2); }
  .settings textarea { height:90px; resize:vertical; }

  .main { position:relative; z-index:1; flex:1; display:flex; min-height:0; }
  /* A: chat history */
  #side { width:250px; flex:none; display:flex; flex-direction:column; border-right:1px solid var(--line); background:var(--head); min-height:0; }
  #side .top { padding:10px; }
  #newChat { width:100%; padding:8px 10px; border:1px solid var(--accent-dim); border-radius:8px; background:var(--accent-soft); color:var(--accent); font-weight:600; cursor:pointer; }
  #side h2 { margin:6px 12px 4px; font:600 12px/1 system-ui; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
  #chats { flex:1; overflow-y:auto; padding:4px 6px 10px; }
  .chatitem { display:flex; align-items:center; gap:4px; padding:7px 8px; border-radius:7px; cursor:pointer; color:var(--text); }
  .chatitem:hover { background:var(--panel2); }
  .chatitem.on { background:var(--accent-soft); color:var(--accent); }
  .chatitem span { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:14px; }
  .chatitem small { color:var(--muted); font-size:11px; flex:none; }
  .chatitem button { flex:none; visibility:hidden; border:0; background:none; color:var(--muted); cursor:pointer; padding:0 4px; }
  .chatitem:hover button { visibility:visible; }
  .side-empty { color:var(--muted); font-size:13px; padding:8px 12px; }

  /* chat column */
  .chatcol { flex:1; display:flex; flex-direction:column; min-width:0; }
  #log { flex:1; overflow-y:auto; padding:18px 16px; display:flex; flex-direction:column; gap:14px; max-width:880px; width:100%; margin:0 auto; }
  .msg { padding:10px 14px; border-radius:10px; overflow-wrap:anywhere; }
  .msg .t { white-space:pre-wrap; }
  .user { background:var(--user); border:1px solid var(--user-line); align-self:flex-end; max-width:85%; }
  .assistant { background:var(--bubble); border:1px solid var(--line); }
  .think { color:var(--muted); font-size:13px; border-left:2px solid var(--line); padding-left:8px; margin-bottom:6px; white-space:pre-wrap; }
  .meta { font-size:12px; color:var(--muted); margin-bottom:6px; font-family:ui-monospace, Consolas, monospace; }
  .thinking { margin:0 0 8px; border:1px solid var(--line); border-radius:8px; background:rgba(127,127,127,.06); font-size:12.5px; color:var(--muted); }
  .thinking summary { cursor:pointer; padding:6px 10px; user-select:none; font-family:ui-monospace, Consolas, monospace; }
  .thinking > div { max-height:220px; overflow:auto; padding:0 10px 8px; white-space:pre-wrap; line-height:1.45; }
  .meta div::before { content:'▸ '; color:var(--accent-dim); }
  pre { position:relative; background:var(--code); border:1px solid var(--line); border-radius:8px; padding:12px; overflow-x:auto; margin:8px 0; }
  pre code { font:13px/1.5 ui-monospace, Consolas, monospace; color:var(--codetext); white-space:pre; }
  pre .copy, pre .open { position:absolute; top:6px; padding:2px 8px; font-size:12px; border-radius:5px; background:var(--panel2); border:1px solid var(--line); cursor:pointer; }
  pre .copy { right:6px; color:var(--muted); }
  pre .open { right:84px; color:var(--accent); }
  .sources { margin-top:8px; padding-top:8px; border-top:1px dashed var(--line); font-size:13px; }
  .sources a { color:var(--accent); text-decoration:none; display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .chips { display:flex; flex-wrap:wrap; gap:6px; }
  .chip { display:inline-flex; align-items:center; gap:6px; max-width:260px; padding:4px 8px; border:1px solid var(--line); border-radius:6px; background:var(--panel2); font-size:12px; }
  .chip span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .chip small { color:var(--muted); }
  .chip.err { border-color:var(--danger); }
  .chip button { padding:0 4px; background:none; border:0; color:var(--muted); cursor:pointer; font-size:14px; }
  .user .chips { margin-bottom:6px; }
  .card { display:flex; align-items:center; gap:10px; margin:8px 0; padding:9px 12px; border:1px solid var(--accent-dim); border-radius:8px; background:var(--accent-soft); cursor:pointer; }
  .card b { color:var(--accent); font-family:ui-monospace, Consolas, monospace; font-size:13px; }
  .card small { color:var(--muted); }
  .approve { margin:8px 0; padding:10px 12px; border:1px solid #c9a227; border-radius:8px; background:rgba(201,162,39,.08); }
  .approve pre { margin:6px 0; }
  .approve .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .approve button { padding:5px 14px; border-radius:6px; border:1px solid var(--line); cursor:pointer; }
  .approve .yes { background:var(--accent); color:var(--ink); border-color:var(--accent); font-weight:600; }
  .approve .no { background:transparent; }
  .mediabox { margin-top:8px; display:flex; flex-direction:column; gap:6px; align-items:flex-start; }
  .mediabox img, .mediabox video { max-width:100%; max-height:60vh; border-radius:8px; border:1px solid var(--line); background:#000; cursor:pointer; }
  .mediabox a { color:var(--accent); font-size:13px; }
  .empty { margin:auto; text-align:center; color:var(--muted); font-size:14px; }
  .empty b { color:var(--text); font-size:20px; display:block; margin-bottom:6px; }

  .composer { border-top:1px solid var(--line); background:var(--head); padding:10px 16px 14px; }
  .composer .inner { max-width:880px; margin:0 auto; display:flex; flex-direction:column; gap:8px; }
  form { display:flex; gap:8px; align-items:stretch; }
  textarea#input { flex:1; resize:none; height:64px; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:var(--panel); }
  textarea:focus, select:focus, .field:focus { outline:1px solid var(--accent-dim); border-color:var(--accent-dim); }
  #send { padding:0 20px; border:0; border-radius:8px; background:var(--accent); color:var(--ink); font-weight:700; cursor:pointer; }
  #send.stop { background:var(--danger); color:#fff; }
  .skillwrap { position:relative; display:flex; }
  #skillBtn { padding:0 12px; border:1px solid var(--line); border-radius:8px; background:var(--panel); color:var(--text); cursor:pointer; white-space:nowrap; font-size:14px; }
  #skillBtn:hover { border-color:var(--accent-dim); }
  #skillBtn b { margin-left:6px; padding:0 6px; border-radius:999px; background:var(--accent); color:var(--ink); font-size:12px; }
  #skillBtn b:empty { display:none; }
  .skillmenu { position:absolute; left:0; bottom:calc(100% + 8px); width:min(340px,80vw); max-height:60vh; overflow:auto; padding:8px; border:1px solid var(--line); border-radius:10px; background:var(--panel); box-shadow:0 12px 32px rgba(0,0,0,.35); display:none; z-index:20; }
  .skillmenu.open { display:block; }
  .skillmenu label { display:flex; gap:10px; align-items:flex-start; padding:8px; border-radius:7px; cursor:pointer; }
  .skillmenu label:hover { background:var(--panel2); }
  .skillmenu input { margin-top:4px; accent-color:var(--accent); }
  .skillmenu b { display:block; font-size:14px; }
  .skillmenu small { color:var(--muted); font-size:12px; line-height:1.4; display:block; }
  .chip.skill { border-color:var(--accent-dim); background:var(--accent-soft); color:var(--accent); }
  @media (max-width:700px) { #skillBtn span { display:none; } }
  #attach { width:46px; border:1px solid var(--line); border-radius:8px; background:var(--panel); color:var(--accent); font-size:26px; line-height:1; cursor:pointer; }
  .secondary { padding:5px 10px; border:1px solid var(--line); border-radius:6px; background:transparent; color:var(--muted); font-size:13px; cursor:pointer; }
  button:disabled { opacity:.45; cursor:default; }

  /* B: results */
  #panel { width:42%; max-width:860px; min-width:340px; flex:none; display:flex; flex-direction:column; border-left:1px solid var(--line); background:var(--head); min-height:0; }
  .ph { display:flex; align-items:center; gap:6px; padding:8px 10px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  .ph .name { font:600 13px/1.2 ui-monospace, Consolas, monospace; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex:1; min-width:80px; }
  .tabs { display:inline-flex; border:1px solid var(--line); border-radius:7px; overflow:hidden; }
  .tabs button { padding:4px 12px; border:0; background:transparent; color:var(--muted); font-size:13px; cursor:pointer; }
  .tabs button.on { background:var(--accent); color:var(--ink); font-weight:600; }
  .pb { flex:1; min-height:0; position:relative; display:flex; }
  .pb > * { flex:1; min-width:0; }
  .pb pre { margin:0; border:0; border-radius:0; overflow:auto; }
  .pb iframe { border:0; background:#fff; width:100%; height:100%; }
  .pb iframe.dark { background:#0b0f0d; }
  .pb .mediaview { display:grid; place-items:center; padding:12px; overflow:auto; }
  .pb .mediaview img, .pb .mediaview video { max-width:100%; max-height:100%; border-radius:8px; }
  .panel-empty { display:grid; place-items:center; text-align:center; color:var(--muted); padding:24px; font-size:14px; }
  .panel-empty b { display:block; color:var(--text); font-size:16px; margin-bottom:6px; }
  .gallery { border-top:1px solid var(--line); padding:8px 10px; }
  .gallery h3 { margin:0 0 6px; font:600 12px/1 system-ui; color:var(--muted); letter-spacing:.04em; }
  .tiles { display:flex; gap:8px; overflow-x:auto; padding-bottom:4px; }
  .tile { flex:none; width:92px; height:68px; border:1px solid var(--line); border-radius:7px; background:var(--panel2); cursor:pointer; overflow:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; font-size:11px; color:var(--muted); }
  .tile.on { border-color:var(--accent); }
  .tile img, .tile video { width:100%; height:100%; object-fit:cover; }
  .tile .ic { font-size:20px; }
  .tile span { max-width:86px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  /* draggable dividers between A | chat | B */
  .gutter { flex:none; width:7px; margin:0 -3px; position:relative; z-index:4; cursor:col-resize; touch-action:none; }
  .gutter::after { content:''; position:absolute; top:0; bottom:0; left:3px; width:1px; background:transparent; transition:background .15s, width .15s, left .15s; }
  .gutter:hover::after, .gutter.active::after { left:2px; width:3px; background:var(--accent); }
  body.resizing { cursor:col-resize; user-select:none; }
  body.resizing iframe, body.resizing video { pointer-events:none; }   /* iframes would swallow the drag */
  #side { border-right:0; }
  #panel { border-left:0; }
  .chatcol { border-left:1px solid var(--line); border-right:1px solid var(--line); }
  body.drag::after { content:attr(data-drop); position:fixed; inset:12px; z-index:50; border:2px dashed var(--accent); border-radius:14px; background:color-mix(in srgb, var(--bg) 80%, transparent); display:grid; place-items:center; color:var(--accent); font-size:20px; }

  @media (max-width:1250px) {
    #gutA { display:none; }
    #side { position:fixed; left:0; top:0; bottom:0; z-index:30; box-shadow:4px 0 24px rgba(0,0,0,.4); transform:translateX(-105%); transition:transform .2s; }
    body.side-open #side { transform:none; }
    .only-narrow.side-btn { display:inline-grid; }
  }
  @media (max-width:900px) {
    #gutB { display:none; }
    #panel { position:fixed; inset:0; width:auto; max-width:none; min-width:0; z-index:25; display:none; }
    body.panel-open #panel { display:flex; }
    .only-narrow { display:inline-grid; }
    .hide-narrow { display:none; }
    .user { max-width:95%; }
  }
</style>
</head>
<body>
<div class="watermark" aria-hidden="true"><img src="/logo.svg" alt=""></div>
<header>
  <button class="icon-btn only-narrow side-btn" id="sideBtn" type="button" data-i18n-title="history">☰</button>
  <div class="brand"><img src="/logo.svg" alt=""><h1>Absolute <b>AI</b></h1></div>
  <select id="model"></select>
  <select id="mode">
    <option value="auto" data-i18n="mode_auto"></option>
    <option value="chat" data-i18n="mode_chat"></option>
    <option value="image" data-i18n="mode_image"></option>
    <option value="video" data-i18n="mode_video"></option>
  </select>
  <select id="quality">
    <option value="fast" data-i18n="q_fast"></option>
    <option value="hd" data-i18n="q_hd"></option>
  </select>
  <label class="toggle" data-i18n-title="web_tip"><input type="checkbox" id="web">🌐 <span data-i18n="web"></span></label>
  <label class="toggle" data-i18n-title="accurate_tip"><input type="checkbox" id="accurate">🎯 <span data-i18n="accurate"></span></label>
  <label class="toggle" data-i18n-title="preview_tip"><input type="checkbox" id="preview" checked>🖥 <span data-i18n="preview"></span></label>
  <span class="spacer"></span>
  <span class="status hide-narrow" id="status"></span>
  <button class="icon-btn only-narrow" id="panelBtn" type="button" data-i18n-title="results">▣</button>
  <button class="icon-btn" id="themeBtn" type="button"></button>
  <select id="uiLang" title="Language">
    <option value="th">🇹🇭 ไทย</option><option value="en">🇬🇧 English</option><option value="zh">🇨🇳 中文</option>
    <option value="ja">🇯🇵 日本語</option><option value="ko">🇰🇷 한국어</option>
  </select>
  <button class="icon-btn" id="settingsBtn" type="button" data-i18n-title="settings">⚙</button>
  <div class="settings" id="settings">
    <label><span data-i18n="replyLang"></span><select id="replyLang"></select></label>
    <label><span data-i18n="systemPrompt"></span><textarea id="system" data-i18n-ph="systemPrompt_ph"></textarea></label>
    <div class="status" id="status2"></div>
  </div>
</header>

<div class="main">
  <aside id="side">
    <div class="top"><button id="newChat" type="button">＋ <span data-i18n="newChat"></span></button></div>
    <h2 data-i18n="history"></h2>
    <div id="chats"></div>
  </aside>
  <div class="gutter" id="gutA" title="ลากเพื่อปรับความกว้าง · ดับเบิลคลิกเพื่อคืนค่า"></div>

  <section class="chatcol">
    <div id="log"></div>
    <div class="composer"><div class="inner">
      <div class="chips" id="skillChips"></div>
      <div class="chips" id="pending"></div>
      <form id="form">
        <button type="button" id="attach" data-i18n-title="attach">+</button>
        <div class="skillwrap">
          <button type="button" id="skillBtn" data-i18n-title="skills_tip">⚡ <span data-i18n="skills"></span><b id="skillCount"></b></button>
          <div class="skillmenu" id="skillMenu"></div>
        </div>
        <input type="file" id="file" multiple hidden
          accept="image/*,.pdf,.docx,.xlsx,.xls,.csv,.txt,.md,.json,.xml,.html,.htm,.css,.js,.jsx,.ts,.tsx,.py,.java,.c,.h,.cpp,.cs,.go,.rs,.php,.rb,.sh,.ps1,.sql,.yaml,.yml,.ini,.toml,.log">
        <textarea id="input" data-i18n-ph="placeholder"></textarea>
        <button id="send" data-i18n="send"></button>
      </form>
    </div></div>
  </section>
  <div class="gutter" id="gutB" title="ลากเพื่อปรับความกว้าง · ดับเบิลคลิกเพื่อคืนค่า"></div>

  <aside id="panel">
    <div class="ph">
      <span class="name" id="pname"></span>
      <div class="tabs" id="tabs"><button type="button" id="tabCode" data-i18n="tabCode"></button><button type="button" id="tabRun" data-i18n="tabRun"></button></div>
      <button class="secondary" type="button" id="pcopy" data-i18n="copy"></button>
      <button class="secondary" type="button" id="pdl" data-i18n="download"></button>
      <button class="secondary only-narrow" type="button" id="pclose">✕</button>
    </div>
    <div class="pb" id="pbody"></div>
    <div class="gallery"><h3 data-i18n="results"></h3><div class="tiles" id="tiles"></div></div>
  </aside>
</div>

<script>
const $ = id => document.getElementById(id);
const log = $('log'), input = $('input'), send = $('send'), modelSel = $('model');
const store = { get(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };

// ---------- interface language ----------

}

const MAX_FILE_CHARS = 30000, MAX_TOTAL_CHARS = 60000;

const canSeeImages = () => caps.includes('vision') && (modelSel.value !== 'auto' || modelsList.some(m => /gemma4|vl/.test(m)));

async function info() {
  try {
    const j = await (await fetch('/api/info')).json();
    modelsList = j.models; mediaReady = j.media;
    const want = ['auto', ...j.models];
    if (want.join() !== [...modelSel.options].map(o => o.value).join()) {
      const keep = modelSel.value || store.get('model', 'auto');
      modelSel.replaceChildren(new Option(t('auto'), 'auto'), ...j.models.map(n => new Option(n, n)));
      modelSel.value = want.includes(keep) ? keep : 'auto';
      loadCaps();
    }
    if (!skillList.length && j.skills.length) { skillList = j.skills; drawSkills(); }
    markMediaReady();
    const where = /:11500$/.test(j.ollama) ? 'A01' : t('thisPc');
    const st = j.ollamaUp ? `${t('ready')} (${where}) · ${t('tools')} ${caps.includes('tools') ? 'on' : 'off'}` : `${t('noOllama')} (${where})`;
    $('status').textContent = st; $('status2').textContent = st;
  } catch { $('status').textContent = t('noBridge'); $('status2').textContent = t('noBridge'); }
}
function markMediaReady() {
  for (const o of $('mode').options) if (o.value === 'image' || o.value === 'video') o.textContent = t('mode_' + o.value) + (mediaReady ? '' : ' ' + t('notReady'));
}
async function loadCaps() {
  try { caps = await (await fetch('/api/caps?model=' + encodeURIComponent(modelSel.value))).json(); } catch { caps = []; }
}
modelSel.onchange = () => { store.set('model', modelSel.value); loadCaps().then(info); };

// ---------- skills (several at once, picker next to +) ----------
let skillList = [];
const selectedSkills = new Set((store.get('skills', '') || '').split(',').filter(Boolean));
const hasSkill = (...ids) => ids.some(id => selectedSkills.has(id));
function drawSkills() {
  $('skillMenu').replaceChildren(...skillList.map(s => {
    const l = document.createElement('label');
    const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = selectedSkills.has(s.id);
    cb.onchange = () => { cb.checked ? selectedSkills.add(s.id) : selectedSkills.delete(s.id); saveSkills(); };
    const d = document.createElement('div'); const b = document.createElement('b'); b.textContent = s.name;
    const sm = document.createElement('small'); sm.textContent = s.description; d.append(b, sm);
    l.append(cb, d); return l;
  }));
  $('skillCount').textContent = selectedSkills.size || '';
  $('skillChips').replaceChildren(...skillList.filter(s => selectedSkills.has(s.id)).map(s => {
    const c = document.createElement('div'); c.className = 'chip skill';
    const sp = document.createElement('span'); sp.textContent = '⚡ ' + s.name;
    const x = document.createElement('button'); x.type = 'button'; x.textContent = '×';
    x.onclick = () => { selectedSkills.delete(s.id); saveSkills(); };
    c.append(sp, x); return c;
  }));
}
function saveSkills() { store.set('skills', [...selectedSkills].join(',')); drawSkills(); }
$('skillBtn').onclick = e => { e.stopPropagation(); $('skillMenu').classList.toggle('open'); };
document.addEventListener('click', e => { if (!$('skillMenu').contains(e.target) && !$('skillBtn').contains(e.target)) $('skillMenu').classList.remove('open'); });

function drawChats() {

    return { kind: 'doc', text: pages.map((s, i) => `--- page ${i + 1} ---\n${s.trim()}`).join('\n'), note: `${pdf.numPages} ${t('pages')}` };
  }
  if (ext === 'docx') { await lib(MAMMOTH); const r = await mammoth.extractRawText({ arrayBuffer: await file.arrayBuffer() }); return { kind: 'doc', text: r.value }; }
  if (ext === 'xlsx' || ext === 'xls') {
    await lib(XLSXJS);
    const wb = XLSX.read(await file.arrayBuffer());
    return { kind: 'doc', text: wb.SheetNames.map(n => `--- sheet: ${n} ---\n` + XLSX.utils.sheet_to_csv(wb.Sheets[n])).join('\n'), note: `${wb.SheetNames.length} sheet` };
  }
  return { kind: 'doc', text: await file.text() };
}
function addFiles(files) {
  for (const file of files) {
    const item = { name: file.name, ready: false };
    pending.push(item);
    extract(file).then(r => {
      Object.assign(item, r, { ready: true });
      if (item.text && item.text.length > MAX_FILE_CHARS) item.text = item.text.slice(0, MAX_FILE_CHARS);
      if (!item.note) item.note = item.text ? `${item.text.length.toLocaleString()} ${t('chars')}` : '';
    }).catch(e => { item.error = e.message; item.ready = true; }).finally(drawPending);
  }
  drawPending();
}
$('attach').onclick = () => $('file').click();
$('file').onchange = e => { addFiles([...e.target.files]); e.target.value = ''; };
input.addEventListener('paste', e => { const f = [...e.clipboardData.files]; if (f.length) { e.preventDefault(); addFiles(f); } });
let dragDepth = 0;
addEventListener('dragenter', e => { if (e.dataTransfer.types.includes('Files')) { dragDepth++; document.body.classList.add('drag'); } });
addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('drag'); } });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => { e.preventDefault(); dragDepth = 0; document.body.classList.remove('drag'); if (e.dataTransfer.files.length) addFiles([...e.dataTransfer.files]); });

// ---------- streaming helper ----------
async function stream(body, onEvent, signal) {
  const r = await fetch('/api/chat', { method: 'POST', signal, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error(await r.text());
  const reader = r.body.getReader(), dec = new TextDecoder();
  let buf = '';
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    const lines = buf.split('\n'); buf = lines.pop();
    for (const line of lines) if (line.trim()) { const ev = JSON.parse(line); if (ev.type === 'error') throw new Error(ev.text); onEvent(ev); }
  }
}

// ---------- chat ----------
const RX_IDEA = /ไอเดีย|idea|ออกแบบ|design|\bui\b|\bux\b|หน้าจอ|หน้าเว็บ|เว็บ|website|web ?app|แอป|\bapp\b|dashboard|แดชบอร์ด|landing|mockup|prototype|ระบบ|system|platform|แพลตฟอร์ม|โปรเจกต์|project/i;
const RX_DIAGRAM = /system analysis|วิเคราะห์ระบบ|สถาปัตยกรรม|architecture|flow ?chart|โฟลว์|er ?diagram|ฐานข้อมูล|database schema|sequence|use ?case|uml/i;

async function chat(text, files) {
  const mode = $('mode').value;
  const display = text || (mode === 'video' ? t('animate') : t('summarize'));
  let content = display, budget = MAX_TOTAL_CHARS;
  const images = [];
  for (const f of files) {
    if (f.error) continue;
    if (f.image && (canSeeImages() || mode === 'video' || modelSel.value === 'auto')) images.push(f.image);
    if (f.text) { const s = f.text.slice(0, Math.max(0, budget)); budget -= s.length; content += `\n\n[ไฟล์แนบ: ${f.name}]\n\`\`\`\n${s}\n\`\`\``; }
  }
  const msgIndex = history.length;
  history.push({ role: 'user', content, display, files: files.map(f => ({ name: f.name, kind: f.kind, note: f.note })), ...(images.length ? { images } : {}) });
  userBubble(display, files);

  const out = bubble('assistant');
  const meta = document.createElement('div'); meta.className = 'meta';
  const body = document.createElement('div');
  out.append(meta, body);
  const note = s => { const d = document.createElement('div'); d.textContent = s; meta.appendChild(d); log.scrollTop = log.scrollHeight; return d; };

  busy = new AbortController();
  send.textContent = t('stop'); send.classList.add('stop');
  let reply = '', progressEl = null, usedMedia = false, thinkBox = null, thinkSum = null, thinkTxt = null, thinkT0 = 0;
  const media = [];
  try {
    await stream({ model: modelSel.value, mode, quality: $('quality').value, messages: history.map(({ role, content, images }) => ({ role, content, ...(images ? { images } : {}) })),
      skills: [...selectedSkills], system: $('system').value.trim(), language: $('replyLang').value, web: $('web').checked, accurate: $('accurate').checked }, ev => {
      if (ev.type === 'token') {
        if (thinkBox && !thinkBox.dataset.closed) { thinkBox.open = false; thinkBox.dataset.closed = 1; thinkSum.textContent = `${t('thought')} (${Math.round((Date.now() - thinkT0) / 1000)}s)`; }
        reply += ev.text; renderText(body, reply); log.scrollTop = log.scrollHeight;
      }
      else if (ev.type === 'thinking') {
        if (!thinkBox) {
          thinkBox = document.createElement('details'); thinkBox.className = 'thinking'; thinkBox.open = true;
          thinkSum = document.createElement('summary'); thinkTxt = document.createElement('div');
          thinkBox.append(thinkSum, thinkTxt); out.insertBefore(thinkBox, body); thinkT0 = Date.now();
        }
        thinkSum.textContent = `${t('thinking')} ${Math.round((Date.now() - thinkT0) / 1000)}s`;
        thinkTxt.textContent += ev.text; thinkTxt.scrollTop = 1e9; log.scrollTop = log.scrollHeight;
      }
      else if (ev.type === 'status') note(ev.text);
      else if (ev.type === 'route') note(`${t('usingModel')} ${ev.model} (${ev.why})`);
      else if (ev.type === 'tool') note(`${t('calling')} ${ev.name} ${JSON.stringify(ev.args).slice(0, 120)}`);
      else if (ev.type === 'progress') { progressEl ??= note(''); progressEl.textContent = `${t('progress')} ${ev.value}/${ev.max} ${t('steps')} (${Math.round(100 * ev.value / ev.max)}%)`; }
      else if (ev.type === 'sources' && ev.sources.length) {
        const src = document.createElement('div'); src.className = 'sources';
        src.append(...ev.sources.map(s => { const a = document.createElement('a'); a.href = s.url; a.target = '_blank'; a.rel = 'noopener noreferrer'; a.textContent = `[${s.n}] ${s.title || s.url}`; a.title = s.url; return a; }));
        out.appendChild(src);
      }
      else if (ev.type === 'media') {
        usedMedia = true;
        const md = { kind: ev.kind, url: ev.url, prompt: ev.prompt };
        media.push(md); mediaBox(out, md);
        addResult({ kind: ev.kind, url: ev.url, prompt: ev.prompt, msg: msgIndex + 1 });
        reply += `${reply ? '\n' : ''}[${t('created_' + ev.kind)}: ${ev.url}] prompt: ${ev.prompt}`;
      }
      else if (ev.type === 'approve') approvalCard(out, ev);
    }, busy.signal);
    if (!meta.childElementCount) meta.remove();
    history.push({ role: 'assistant', content: reply, ...(media.length ? { media } : {}) });
    // code in the answer -> results panel
    const blocks = blocksOf(reply), art = pickArtifact(blocks);
    if (art) { const r = addResult({ kind: 'code', ...art, all: blocks, msg: msgIndex + 1 }); resultCard(out, r); }
    else if (!usedMedia && $('preview').checked && reply.length > 200 && (hasSkill('design', 'vibe-code', 'system-analysis') || RX_IDEA.test(display))) {
      await mockup(out, display, reply, msgIndex + 1);
    }
  } catch (e) {
    if (e.name === 'AbortError') { history.push({ role: 'assistant', content: reply }); note(t('stopped')); }
    else { body.textContent = `${t('error')}: ${e.message}`; history.pop(); }
  } finally {
    busy = null; send.textContent = t('send'); send.classList.remove('stop'); input.focus();
    saveChat();
  }
}

// ideas -> an automatic visual preview in panel B (HTML mockup, or Mermaid diagram for system analysis)
// code inside the first ``` fence, also while the closing fence has not arrived yet
const fenceBody = s => { const m = s.match(/```[\w-]*[^\n]*\n([\s\S]*?)(```|$)/); return m ? m[1] : (/^\s*</.test(s) ? s : ''); };

async function mockup(out, question, answer, msg) {
  const kind = (hasSkill('system-analysis') && !hasSkill('design', 'vibe-code')) || RX_DIAGRAM.test(question) ? 'diagram' : 'ui';
  const status = document.createElement('div'); status.className = 'meta'; status.textContent = '▸ ' + t(kind === 'diagram' ? 'diagramMaking' : 'mockupMaking'); out.appendChild(status);
  const live = { kind: 'code', lang: kind === 'diagram' ? 'mermaid' : 'html', code: '', name: kind === 'diagram' ? 'diagram.mmd' : 'mockup.html' };
  current = live; $('pname').textContent = t(kind === 'diagram' ? 'diagramMaking' : 'mockupMaking'); $('tabs').style.visibility = 'visible';
  $('tabRun').disabled = kind === 'diagram';   // partial Mermaid does not render; partial HTML does
  showTab('code');
  document.body.classList.add('panel-open');
  let text = '', switched = false, lastPaint = 0, paintTimer = null;
  // live preview: re-render the partial page at most every 1.2 s while it streams (like Claude artifacts)
  const paint = () => { paintTimer = null; lastPaint = Date.now(); if (current === live && $('tabRun').classList.contains('on')) showTab('run'); };
  await stream({ mode: 'mockup', kind, idea: `User: ${question}\n\nAssistant: ${answer}` }, ev => {
    if (ev.type !== 'token') return;
    text += ev.text; live.code = fenceBody(text);
    if (current !== live) return;   // user opened another result meanwhile
    if (kind === 'ui' && !switched && /<body|<main|<div/i.test(live.code)) { switched = true; showTab('run'); return; }
    if ($('tabRun').classList.contains('on')) { if (!paintTimer) paintTimer = setTimeout(paint, Math.max(0, 1200 - (Date.now() - lastPaint))); }
    else { const c = $('pbody').querySelector('code'); if (c) { c.textContent = live.code; c.parentElement.scrollTop = 1e9; } }
  }, busy.signal);
  clearTimeout(paintTimer);
  const block = blocksOf(text).find(b => b.lang === live.lang) || blocksOf(text)[0];
  status.remove();
  if (!block) return;
  const r = addResult({ kind: 'code', lang: block.lang, code: block.code, name: live.name, labelKey: kind === 'diagram' ? 'diagramCard' : 'mockupCard', msg }, true);
  resultCard(out, r);
}

function approvalCard(out, ev) {
  const box = document.createElement('div'); box.className = 'approve';
  const h = document.createElement('div'); h.textContent = '⚠ ' + t('approveTitle');
  const pre = document.createElement('pre'); const c = document.createElement('code'); c.textContent = ev.command; pre.appendChild(c);
  const small = document.createElement('div'); small.className = 'status'; small.textContent = ev.cwd;
  const row = document.createElement('div'); row.className = 'row';
  const yes = document.createElement('button'); yes.className = 'yes'; yes.type = 'button'; yes.textContent = t('approve');
  const no = document.createElement('button'); no.className = 'no'; no.type = 'button'; no.textContent = t('deny');
  const answer = async ok => {
    yes.disabled = no.disabled = true;
    await fetch('/api/approve', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id: ev.id, ok }) });
    row.replaceChildren(ok ? '✔ ' + t('approved') : '✖ ' + t('denied'));
  };
  yes.onclick = () => answer(true); no.onclick = () => answer(false);
  row.append(yes, no); box.append(h, pre, small, row); out.appendChild(box); log.scrollTop = log.scrollHeight;
}

$('form').addEventListener('submit', e => {
  e.preventDefault();
  if (busy) { busy.abort(); return; }
  if (pending.some(f => !f.ready)) { $('status').textContent = t('waitFiles'); return; }
  const s = input.value.trim();
  if (!s && !pending.length) return;
  const files = pending; pending = []; drawPending();
  input.value = '';
  chat(s, files);
});
input.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('form').requestSubmit(); } });

// ---------- resizable panels: drag the dividers, double-click to reset ----------
function resizer(gut, target, key, edge, min, maxFrac) {
  const apply = w => {
    // keep the chat column usable (>= 380 px) next to the other side bar
    const other = target.id === 'panel' ? $('side') : $('panel');
    const otherW = getComputedStyle(other).position === 'fixed' || getComputedStyle(other).display === 'none' ? 0 : other.getBoundingClientRect().width;
    const max = Math.max(min, Math.min(window.innerWidth * maxFrac, window.innerWidth - otherW - 380));
    w = Math.min(max, Math.max(min, w));
    target.style.width = w + 'px'; target.style.maxWidth = 'none'; target.style.minWidth = '0';
    return w;
  };
  const saved = +store.get(key, 0);
  if (saved) apply(saved);
  gut.addEventListener('pointerdown', e => {
    e.preventDefault();
    gut.setPointerCapture(e.pointerId);
    gut.classList.add('active'); document.body.classList.add('resizing');
    const move = ev => apply(edge === 'left' ? ev.clientX - target.getBoundingClientRect().left : target.getBoundingClientRect().right - ev.clientX);
    const up = () => {
      gut.releasePointerCapture(e.pointerId);
      gut.classList.remove('active'); document.body.classList.remove('resizing');
      gut.removeEventListener('pointermove', move); gut.removeEventListener('pointerup', up);
      store.set(key, Math.round(target.getBoundingClientRect().width));
    };
    gut.addEventListener('pointermove', move); gut.addEventListener('pointerup', up);
  });
  gut.addEventListener('dblclick', () => { target.style.width = target.style.maxWidth = target.style.minWidth = ''; store.set(key, ''); });
  addEventListener('resize', () => { if (target.style.width) apply(parseFloat(target.style.width)); });
}
resizer($('gutA'), $('side'), 'sideWidth', 'left', 180, 0.35);
resizer($('gutB'), $('panel'), 'panelWidth', 'right', 280, 0.75);

setTheme(store.get('theme', 'dark'));
applyI18n();
info(); setInterval(info, 15000);
loadChats();
